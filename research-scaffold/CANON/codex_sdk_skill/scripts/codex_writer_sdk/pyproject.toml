[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-writer"
version = "0.1.0"
description = "Python wrapper and daemon toolkit for Codex article generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-writer = "codex_writer.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
